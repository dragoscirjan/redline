# yaml-language-server: $schema=./skill-catalog.schema.json
# One authored catalog: sources, installation, adaptation intent, selection, and deprecations.
# Installation argv describes an approved mechanism; inspection never executes it.
schemaVersion: 2
repository: https://github.com/dragoscirjan/ai
ref: main
defaults:
  exclude: [ agents/openai.yaml, "**/agents/openai.yaml", node_modules/**, .git/** ]
skills:
  archify:
    kind: upstream
    description: "Generate validated interactive HTML diagrams or one-page explainers with Archify, including architecture, workflows, Mermaid input, and image/SVG/WebM exports."
    source:
      type: github
      repository: https://github.com/tt-a1i/archify
      revision: a7ed6fd6657da90414831d1d42cf95987188750c
      path: archify
    category: diagramming
    selection: optional
    safety: project-write-with-confirmation
    harnesses: [pi, opencode, claude-code]
    prerequisites: []
    signals:
      askWithoutSignals: true
    install:
      argv: [npx, -y, skills@1.7.4, add, https://github.com/tt-a1i/archify/tree/a7ed6fd6657da90414831d1d42cf95987188750c/archify, --skill, archify]
    runtime:
      - "Node.js 18 or newer; Chrome/Chromium or Microsoft Edge for required browser verification. The package is self-contained; missing tools require separately approved setup."
    legal:
      - path: archify/LICENSE
        target: LICENSE
        spdx: Apache-2.0
      - path: archify/LICENSE-MIT
        target: LICENSE-MIT
        spdx: MIT
      - path: archify/NOTICE
        target: NOTICE
        spdx: NOASSERTION
      - path: archify/THIRD_PARTY_NOTICES.md
        target: THIRD_PARTY_NOTICES.md
        spdx: NOASSERTION
      - path: archify/assets/JetBrainsMono-OFL.txt
        target: assets/JetBrainsMono-OFL.txt
        spdx: OFL-1.1
      - path: archify/explainer/vendor/pele/LICENSE
        target: explainer/vendor/pele/LICENSE
        spdx: MIT
  asd-ste100-technical:
    kind: authored
    description: "Technical writing: use ASD-STE100-inspired plain language for software responses and documentation."
    source:
      type: local
      path: .agents/skills/documentation/asd-ste100-technical
    category: communication
    selection: recommended
    safety: read-only-guidance
    harnesses: [ pi, opencode, claude-code ]
    prerequisites: []
    signals:
      askWithoutSignals: true
    install:
      argv: [ npx, -y, skills@1.7.4, add, https://github.com/dragoscirjan/ai/tree/main/.agents/skills/documentation/asd-ste100-technical, --skill, asd-ste100-technical ]
    legal:
      - path: LICENSE
        target: LICENSE
        spdx: MIT
  caveman:
    kind: authored
    description: Concise communication that preserves complete technical substance.
    source:
      type: local
      path: .agents/skills/documentation/caveman
    category: communication
    selection: optional
    safety: read-only-guidance
    harnesses: [ pi, opencode, claude-code ]
    prerequisites: []
    signals:
      askWithoutSignals: true
    install:
      argv: [ npx, -y, skills@1.7.4, add, https://github.com/dragoscirjan/ai/tree/main/.agents/skills/documentation/caveman, --skill, caveman ]
    legal:
      - path: LICENSE
        target: LICENSE
        spdx: MIT
  cleanup-workspaces:
    kind: authored
    description: "Audit integrated Git/Jujutsu workspaces, stale registrations, or authorized temporary lanes; apply only an approved exact cleanup plan."
    source:
      type: local
      path: .agents/skills/utility/cleanup-workspaces
    category: workspace
    selection: optional
    safety: destructive-with-confirmation
    harnesses: [ pi, opencode, claude-code ]
    prerequisites: [ isolated-workspace ]
    runtime:
      - Requires Bun and either Git with worktree support or Jujutsu 0.38 or newer with workspace support.
    signals: {}
    install:
      argv: [ npx, -y, skills@1.7.4, add, https://github.com/dragoscirjan/ai/tree/main/.agents/skills/utility/cleanup-workspaces, --skill, cleanup-workspaces ]
    legal:
      - path: LICENSE
        target: LICENSE
        spdx: MIT
  code-review:
    kind: adapted
    description: "Review the changes since a fixed point (commit, branch, tag, or merge-base) along two axes: Standards
      (does the code follow this repo's documented coding standards?) and Spec (does the code match what the originating
      issue/spec asked for?). Runs both reviews in parallel sub-agents and reports them side by side. Use when the user
      wants to review a branch, a PR, work-in-progress changes, or asks to \"review since X\"."
    source:
      type: local
      path: .agents/skills/coding/code-review
    upstream:
      type: github
      repository: https://github.com/mattpocock/skills
      revision: 59db609eb1e18aaf59b63284d0e52255aff0c63c
      path: skills/engineering/code-review
    category: review
    selection: optional
    safety: read-only-subagents
    harnesses: [ pi, opencode, claude-code ]
    prerequisites: []
    capabilities: [ parallel-subagents ]
    runtime:
      - Requires Git and a harness that can run two read-only subagents in parallel.
    signals:
      askWithoutSignals: true
    install:
      argv: [ npx, -y, skills@1.7.4, add, https://github.com/dragoscirjan/ai/tree/main/.agents/skills/coding/code-review, --skill, code-review ]
    adaptation:
      instructions: Preserve separate Standards and Spec reviews, read-only parallel reviewers, immutable Git endpoints, safe
        revision arguments, and the chosen comparison semantics. Reviewers must not mutate, publish, or delegate. Do not
        restore harness/model configuration.
      review:
        - Preserve substantive behavior and all mandatory prerequisites.
        - Show the diff and explain any target-specific change.
        - Keep required legal notices unchanged; omit agents/openai.yaml.
  coding:
    kind: authored
    description: "Design, implement, refactor, review, or test code under project conventions, risk-based security, and behavior-focused checks."
    source:
      type: local
      path: .agents/skills/coding/coding
    category: coding-base
    selection: detected
    safety: project-write-guidance
    harnesses: [ pi, opencode, claude-code ]
    prerequisites: []
    signals:
