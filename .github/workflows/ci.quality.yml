name: CI » Validate container images

on:
  workflow_call: {}

permissions: {}

jobs:
  validate:
    name: Check definitions
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.0.0
        with:
          node-version: 24

      - name: Validate image package metadata
        shell: bash
        run: |
          set -euo pipefail
          test -f packages/base-runner/Dockerfile
          test -f packages/pi-runner/Dockerfile
          test -f packages/opencode-runner/Dockerfile
          grep -Eq '^codegraphcontext==[0-9]+\\.[0-9]+\\.[0-9]+$' packages/base-runner/mcp/codegraphcontext-requirements.txt
          grep -Fq -- '--with-requirements /opt/redline/mcp/codegraphcontext-requirements.txt codegraphcontext' packages/base-runner/Dockerfile
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';

          const jsonFiles = [
            'packages/base-runner/mcp/package.json',
            'packages/base-runner/mcp/mcp-servers.json',
            'packages/pi-runner/pi/settings.json',
            'packages/opencode-runner/opencode/opencode.json',
          ];

          for (const file of jsonFiles) JSON.parse(fs.readFileSync(file, 'utf8'));

          const pi = JSON.parse(fs.readFileSync(jsonFiles[2], 'utf8'));
          const opencode = JSON.parse(fs.readFileSync(jsonFiles[3], 'utf8'));
          for (const server of ['sequential-thinking', 'gitnexus', 'codegraphcontext', 'context-mode']) {
            assert.ok(pi.mcpServers[server], `Pi missing MCP server: ${server}`);
            assert.ok(opencode.mcp[server], `OpenCode missing MCP server: ${server}`);
          }
          NODE

      - name: Lint base runner Dockerfile
        uses: hadolint/hadolint-action@54c9adbab1582c2ef04b2016b760714a4bfde3cf # v3.1.0
        with:
          dockerfile: packages/base-runner/Dockerfile
          failure-threshold: error

      - name: Lint Pi runner Dockerfile
        uses: hadolint/hadolint-action@54c9adbab1582c2ef04b2016b760714a4bfde3cf # v3.1.0
        with:
          dockerfile: packages/pi-runner/Dockerfile
          failure-threshold: error

      - name: Lint OpenCode runner Dockerfile
        uses: hadolint/hadolint-action@54c9adbab1582c2ef04b2016b760714a4bfde3cf # v3.1.0
        with:
          dockerfile: packages/opencode-runner/Dockerfile
          failure-threshold: error

      - name: Check workflow syntax
        uses: rhysd/actionlint@03d0035246f3e81f36aed592ffb4bebf33a03106 # v1.7.7

