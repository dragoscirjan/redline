name: CI » Publish runner images

on:
  workflow_call: {}

permissions: {}

concurrency:
  group: runner-image-release
  cancel-in-progress: false

jobs:
  publish:
    name: Build and publish multi-platform images
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@29109295f81e9208d7d86ff1c6c12d2833863392 # v3.6.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Login to GitHub Container Registry
        uses: docker/login-action@5e57cd118135c172c3672efd75eb46360885c0ef # v3.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish base runner
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: packages/base-runner/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/redline-base-runner:latest
            ghcr.io/${{ github.repository_owner }}/redline-base-runner:${{ github.sha }}
          cache-from: type=gha,scope=base-runner
          cache-to: type=gha,mode=max,scope=base-runner

      - name: Publish Pi runner
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: packages/pi-runner/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            RUNNER_BASE=ghcr.io/${{ github.repository_owner }}/redline-base-runner:${{ github.sha }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/redline-pi-runner:latest
            ghcr.io/${{ github.repository_owner }}/redline-pi-runner:${{ github.sha }}
          cache-from: type=gha,scope=pi-runner
          cache-to: type=gha,mode=max,scope=pi-runner

      - name: Publish OpenCode runner
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: packages/opencode-runner/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            RUNNER_BASE=ghcr.io/${{ github.repository_owner }}/redline-base-runner:${{ github.sha }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/redline-opencode-runner:latest
            ghcr.io/${{ github.repository_owner }}/redline-opencode-runner:${{ github.sha }}
          cache-from: type=gha,scope=opencode-runner
          cache-to: type=gha,mode=max,scope=opencode-runner

      - name: Delete old image versions, keep the latest 11
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: ${{ github.repository_owner }}
          OWNER_TYPE: ${{ github.event.repository.owner.type }}
          GHCR_API_ROOT: ${{ github.event.repository.owner.type == 'Organization' && format('/orgs/{0}/packages/container', github.repository_owner) || format('/users/{0}/packages/container', github.repository_owner) }}
        run: |
          set -euo pipefail
          packages=(redline-base-runner redline-pi-runner redline-opencode-runner)
          api_root="$GHCR_API_ROOT"

          for package in "${packages[@]}"; do
            gh api --paginate "${api_root}/${package}/versions" > "${RUNNER_TEMP}/${package}-versions.json"
            node --input-type=module - "${RUNNER_TEMP}/${package}-versions.json" > "${RUNNER_TEMP}/${package}-delete-ids.txt" <<'NODE'
          import fs from 'node:fs';
          const records = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          const protectedTags = new Set(['latest', process.env.GITHUB_SHA.toLowerCase()]);
          const releaseVersions = records
            .filter((entry) => (entry.metadata?.container?.tags ?? []).some((tag) => /^v?\d+\.\d+\.\d+$/.test(tag)))
            .sort((a, b) => b.created_at.localeCompare(a.created_at));
          const keep = releaseVersions.slice(0, 11);
          const keepIds = new Set(keep.map((entry) => entry.id));
          for (const entry of releaseVersions) {
            const tags = entry.metadata?.container?.tags ?? [];
            if (keepIds.has(entry.id) || tags.some((tag) => protectedTags.has(tag))) continue;
            console.log(entry.id);
          }
          NODE
            while IFS= read -r version_id; do
              [[ -n "$version_id" ]] || continue
              gh api --method DELETE "${api_root}/${package}/versions/${version_id}"
            done < "${RUNNER_TEMP}/${package}-delete-ids.txt"
          done
