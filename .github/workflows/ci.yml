name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    name: Validate (typecheck, build, test, docs)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.0.0
        with:
          node-version: 24

      - name: Install dependencies
        uses: ./.github/actions/install-dependencies
        with:
          telemetry-label: validate

      - name: Typecheck and test
        shell: bash
        run: |
          set -euo pipefail
          pnpm run typecheck
          pnpm test
          pnpm run docs

      - name: Verify deterministic performance evidence
        shell: bash
        run: |
          set -euo pipefail
          pnpm run benchmark:performance
          pnpm run benchmark:model-execution
          pnpm run benchmark:review-eligibility
          pnpm run benchmark:checkout
          evidence_changes="$(git status --porcelain --untracked-files=all -- \
            benchmark/performance/v1/baseline \
            benchmark/model-execution/v1/live-glm-5.3-flash/report.json \
            benchmark/model-execution/v1/live-glm-5.3-flash/report.md \
            benchmark/review-eligibility/v1/report.json \
            benchmark/review-eligibility/v1/report.md \
            benchmark/checkout/v1/profile.json \
            benchmark/checkout/v1/aggregate.json \
            benchmark/checkout/v1/report.md)"
          if [[ -n "$evidence_changes" ]]; then
            printf 'performance evidence changed:\n%s\n' "$evidence_changes" >&2
            git diff -- \
              benchmark/performance/v1/baseline \
              benchmark/model-execution/v1/live-glm-5.3-flash/report.json \
              benchmark/model-execution/v1/live-glm-5.3-flash/report.md \
              benchmark/review-eligibility/v1/report.json \
              benchmark/review-eligibility/v1/report.md \
              benchmark/checkout/v1/profile.json \
              benchmark/checkout/v1/aggregate.json \
              benchmark/checkout/v1/report.md >&2
            exit 1
          fi

      - name: Check workflow syntax
        uses: rhysd/actionlint@03d0035246f3e81f36aed592ffb4bebf33a03106 # v1.7.7

  # The PR test matrix runs every available harness end to end against a
  # local mock model endpoint: the deterministic echo harness, real Pi, and
  # real OpenCode. No secrets or network model access are required.
  harness-matrix:
    name: Harness matrix (${{ matrix.harness }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        harness: [echo, pi, opencode]
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.0.0
        with:
          node-version: 24

      - name: Install dependencies
        uses: ./.github/actions/install-dependencies
        with:
          telemetry-label: harness-${{ matrix.harness }}

      - name: Install harness binary
        shell: bash
        env:
          HARNESS: ${{ matrix.harness }}
        run: |
          set -euo pipefail
          case "$HARNESS" in
            echo) ;;
            # pi ships its bundle through prepublishOnly and needs no
            # install scripts; opencode-ai links its platform binary in a
            # postinstall script, so --ignore-scripts would break it.
            pi) npm install -g --ignore-scripts @earendil-works/pi-coding-agent ;;
            opencode) npm install -g opencode-ai@1.18.34 ;;
            *) printf 'unsupported harness: %s\n' "$HARNESS" >&2; exit 2 ;;
          esac

      # Runs the full review pipeline per harness against the local mock
      # model endpoint and keeps the review output for the artifact below.
      - name: Run harness review end to end
        shell: bash
        env:
          HARNESS: ${{ matrix.harness }}
          HARNESS_MATRIX_OUTPUT_DIR: ${{ runner.temp }}/harness-reviews
        run: bash test/harness-matrix-run.sh "$HARNESS"

      # The per-harness review findings artifact: per-file JSON/Markdown
      # records and the run summary exactly as the review tool wrote them.
      # The name carries run id and attempt so workflow re-runs do not
      # collide with the immutable-artifact policy of upload-artifact v4+.
      # The upload must not depend on the review run succeeding: the partial
      # records of a failed run are exactly what the failure inspection needs.
      - name: Upload harness review artifact
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: harness-${{ matrix.harness }}-reviews-${{ github.run_id }}-attempt${{ github.run_attempt }}
          path: ${{ runner.temp }}/harness-reviews/
          if-no-files-found: error
          retention-days: 14

  local-cli:
    name: Local CLI (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x64
            runner: ubuntu-24.04
            platform: linux
            arch: x64
            shell: sh
          - target: linux-arm64
            runner: ubuntu-24.04-arm
            platform: linux
            arch: arm64
            shell: sh
          - target: macos-x64
            runner: macos-15-intel
            platform: darwin
            arch: x64
            shell: sh
          - target: macos-arm64
            runner: macos-15
            platform: darwin
            arch: arm64
            shell: sh
          - target: windows-x64
            runner: windows-2025
            platform: win32
            arch: x64
            shell: pwsh
          - target: windows-arm64
            runner: windows-11-arm
            platform: win32
            arch: arm64
            shell: pwsh
    defaults:
      run:
        shell: ${{ matrix.shell }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up native Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.0.0
        with:
          node-version: 24
          architecture: ${{ matrix.arch }}

      - name: Verify actual runtime platform and architecture
        env:
          EXPECTED_PLATFORM: ${{ matrix.platform }}
          EXPECTED_ARCH: ${{ matrix.arch }}
        run: node -e 'if (process.platform !== process.env.EXPECTED_PLATFORM || process.arch !== process.env.EXPECTED_ARCH) process.exit(1)'

      - name: Install frozen dependencies without scripts
        run: corepack pnpm@10.33.0 install --frozen-lockfile --ignore-scripts

      - name: Typecheck
        run: corepack pnpm@10.33.0 run typecheck

      - name: Exercise local capture, reporting, cancellation, and offline npm installation
        run: corepack pnpm@10.33.0 exec vitest run test/application.test.ts test/local-cli.test.ts test/package.test.ts test/npm-release.test.ts test/cli-reporter.test.ts

  source-runtime:
    name: Source runtime (${{ matrix.runtime }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        runtime: [node, bun]
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up Node.js toolchain
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.0.0
        with:
          node-version: 24

      - name: Set up pinned Bun runtime
        if: ${{ matrix.runtime == 'bun' }}
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.4

      - name: Install dependencies
        uses: ./.github/actions/install-dependencies
        with:
          telemetry-label: source-runtime-${{ matrix.runtime }}

      - name: Run trusted TypeScript integration tests
        shell: bash
        env:
          SOURCE_RUNTIME: ${{ matrix.runtime }}
        run: |
          set -euo pipefail
          pnpm exec bats \
            test/source-runtime.bats \
            test/context-bundle.bats \
            test/review-cli.bats \
            test/harness-matrix.bats

      - name: Measure source runtime
        shell: bash
        env:
          SOURCE_RUNTIME: ${{ matrix.runtime }}
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/source-runtime-benchmark"
          "$SOURCE_RUNTIME" src/benchmark/source-runtime-cli.ts \
            --runtime "$SOURCE_RUNTIME" \
            --json "${RUNNER_TEMP}/source-runtime-benchmark/report.json" \
            --markdown "${RUNNER_TEMP}/source-runtime-benchmark/report.md"
          cat "${RUNNER_TEMP}/source-runtime-benchmark/report.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Start composite action measurement
        if: ${{ github.event_name == 'pull_request' }}
        shell: bash
        run: printf '%s\n' "$(( $(date +%s%N) / 1000000 ))" > "${RUNNER_TEMP}/source-runtime-benchmark/action-start-ms"

      - name: Run composite action from TypeScript source
        id: action-smoke
        if: ${{ github.event_name == 'pull_request' }}
        uses: ./github
        with:
          runtime: ${{ matrix.runtime }}
          backend: echo
          model-config: '{"provider":"mock","endpoint":"http://127.0.0.1:1/v1","model":"test-model"}'
          model-auth: '{"mock":"test-key"}'
          indexing: disabled
          artifact-name: source-runtime-${{ matrix.runtime }}-${{ github.run_id }}-attempt${{ github.run_attempt }}
          artifact-retention-days: 1

      - name: Record composite action measurement
        if: ${{ always() && github.event_name == 'pull_request' }}
        shell: bash
        env:
          ACTION_OUTCOME: ${{ steps.action-smoke.outcome }}
          SOURCE_RUNTIME: ${{ matrix.runtime }}
        run: |
          set -euo pipefail
          started=$(<"${RUNNER_TEMP}/source-runtime-benchmark/action-start-ms")
          finished=$(( $(date +%s%N) / 1000000 ))
          duration=$(( finished - started ))
          printf '{"version":1,"runtime":"%s","outcome":"%s","durationMs":%s}\n' \
            "$SOURCE_RUNTIME" "$ACTION_OUTCOME" "$duration" \
            > "${RUNNER_TEMP}/source-runtime-benchmark/action.json"
          printf '\n- Composite action smoke: %s ms (%s)\n' "$duration" "$ACTION_OUTCOME" \
            >> "${RUNNER_TEMP}/source-runtime-benchmark/report.md"
          printf '## Composite action smoke\n\n- Runtime: %s\n- Duration: %s ms\n- Outcome: %s\n' \
            "$SOURCE_RUNTIME" "$duration" "$ACTION_OUTCOME" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload source runtime benchmark
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: source-runtime-${{ matrix.runtime }}-${{ github.run_id }}-attempt${{ github.run_attempt }}
          path: ${{ runner.temp }}/source-runtime-benchmark/
          if-no-files-found: error
          retention-days: 14

  docs:
    needs: [validate, harness-matrix, source-runtime]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
    uses: ./.github/workflows/docs.publish.yml
    # The publish job inside docs.publish.yml references the actor-owned PAT;
    # without inherited secrets the nested call cannot resolve GH_TOKEN.
    secrets: inherit
