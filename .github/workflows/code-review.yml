# Reusable Redline review workflow for other repositories. Call it from a
# pull_request_target workflow so review secrets are available.
name: Redline pull request review

on:
  workflow_call:
    inputs:
      backend:
        description: Review harness, pi, opencode, or the deterministic echo harness. Required together with model-config and model-auth to enable review execution.
        required: false
        type: string
        default: ""
      model-config:
        description: Provider-neutral model configuration JSON (provider, endpoint, model).
        required: false
        type: string
        default: ""
      finding-scope:
        description: Finding scope, defects or defects-and-risks
        required: false
        type: string
        default: defects
      verbosity:
        description: Live model stream in the run log - silent, progress (dots), or full-output. Default progress.
        required: false
        type: string
        default: progress
      indexing:
        description: Indexed-context mode, enabled or disabled. Default enabled.
        required: false
        type: string
        default: enabled
      indexing-provider:
        description: Code-index provider, cgc or gitnexus. Default cgc.
        required: false
        type: string
        default: cgc
      report-style:
        description: Report style, single-block or inline. Legacy input kept for the previously published action; the current action ignores it.
        required: false
        type: string
        default: single-block
      timeout:
        description: Per-file model deadline as a duration. Capped at 360m.
        required: false
        type: string
        default: 4m
      run-timeout:
        description: Whole-review deadline; unstarted files become explicit omissions.
        required: false
        type: string
        default: 10m
      review-concurrency:
        description: Maximum simultaneous per-file model calls, from 1 through 8.
        required: false
        type: number
        default: 4
      runtime:
        description: Trusted TypeScript runtime, node or bun. Default node.
        required: false
        type: string
        default: node
      credential-isolation:
        description: Credential isolation mode. Only direct is supported; required explicitly when review execution is enabled against the previously published action.
        required: false
        type: string
        default: ""
      container-engine:
        description: Container engine used by the previously published action's staging layer, podman or docker. The current action ignores it.
        required: false
        type: string
        default: docker
      artifact-name:
        description: Base name for the downloadable review artifacts
        required: false
        type: string
        default: redline-review-${{ github.run_id }}
      artifact-retention-days:
        description: Number of days to retain review artifacts, from 1 to 90
        required: false
        type: number
        default: 45
    secrets:
      github-token:
        description: GitHub publication token; bind to secrets.GH_TOKEN. Required by the previously published action's review mode; the current action ignores it.
        required: false
      model-auth:
        description: Provider-keyed credential map (JSON); bind to secrets.MODEL_CREDENTIALS.
        required: false

permissions: {}

concurrency:
  group: redline-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    name: Redline review
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out trusted workflow tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0
        with:
          repository: ${{ github.repository }}
          # The base revision is trusted under pull_request_target. Pull
          # request code is never checked out.
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
          fetch-depth: 0

      - name: Write pull request requirements
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          set -euo pipefail
          mkdir -p review
          {
            printf '# Pull request requirements\n\n'
            printf 'PR #%s: %s\n\n%s\n\n%s\n' "$PR_NUMBER" "$PR_TITLE" "$PR_BODY" "$PR_URL"
          } > pr-requirements.md

      # `$/` resolves against the called workflow's repository at the same
      # running commit. Unlike `./github`, it never resolves against the
      # external caller's workspace, and unlike an @v1 self-call, it cannot
      # drift from this workflow revision.
      #
      # report-style, credential-isolation, and container-engine remain on the
      # reusable-workflow surface for caller compatibility but are not
      # forwarded to the current action. Leave backend, model-config, and the
      # model-auth secret empty together for context-only mode; a partial set
      # is rejected.
      - name: Run Redline review action
        uses: $/github
        with:
          backend: ${{ inputs.backend }}
          model-config: ${{ inputs.model-config }}
          model-auth: ${{ secrets.model-auth }}
          github-token: ${{ secrets.github-token }}
          finding-scope: ${{ inputs.finding-scope }}
          verbosity: ${{ inputs.verbosity }}
          indexing: ${{ inputs.indexing }}
          indexing-provider: ${{ inputs.indexing-provider }}
          timeout: ${{ inputs.timeout }}
          run-timeout: ${{ inputs.run-timeout }}
          review-concurrency: ${{ inputs.review-concurrency }}
          runtime: ${{ inputs.runtime }}
          artifact-name: ${{ inputs.artifact-name }}
          artifact-retention-days: ${{ inputs.artifact-retention-days }}