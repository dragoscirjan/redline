name: Redline Docker image

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: docker-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Native Docker (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/install-dependencies
        with:
          telemetry-label: docker-${{ matrix.arch }}
      - name: Restore and save persistent provider data
        uses: actions/cache@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # v5.0.3
        with:
          path: ${{ runner.temp }}/redline-code-index/cache
          key: redline-image-index-${{ matrix.arch }}-${{ hashFiles('containers/Dockerfile', 'containers/package.json', 'containers/pnpm-lock.yaml', 'containers/requirements.txt', 'src/code-index/**') }}-${{ github.event.pull_request.base.sha || github.sha }}
          restore-keys: |
            redline-image-index-${{ matrix.arch }}-${{ hashFiles('containers/Dockerfile', 'containers/package.json', 'containers/pnpm-lock.yaml', 'containers/requirements.txt', 'src/code-index/**') }}-
      - name: Build the Redline image
        run: docker build --file containers/Dockerfile --tag redline:test .
      - name: Test real harnesses with a synthetic model
        env:
          REDLINE_CONTAINER_TESTS: '1'
          REDLINE_CONTAINER_IMAGE: redline:test
          REDLINE_CONTAINER_CACHE: ${{ runner.temp }}/redline-code-index/cache
        run: pnpm exec vitest run test/container.test.ts

  publish:
    needs: test
    if: github.repository == 'dragoscirjan/redline' && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: containers/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:main
            ghcr.io/${{ github.repository }}:${{ github.sha }}
          provenance: true
          sbom: true
