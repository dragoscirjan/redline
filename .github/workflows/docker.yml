name: Redline Docker image

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: docker-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  test:
    name: Native Docker (${{ matrix.arch }})
    if: github.repository == 'dragoscirjan/redline' && github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/install-dependencies
        with:
          telemetry-label: docker-${{ matrix.arch }}
      - name: Restore and save persistent provider data
        uses: actions/cache@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # v5.0.3
        with:
          path: ${{ runner.temp }}/redline-code-index/cache
          key: redline-image-index-${{ matrix.arch }}-${{ hashFiles('containers/Dockerfile', 'containers/package.json', 'containers/pnpm-lock.yaml', 'containers/requirements.txt', 'containers/preload-cgc-parsers.py', 'src/code-index/**') }}-${{ github.sha }}
          restore-keys: |
            redline-image-index-${{ matrix.arch }}-${{ hashFiles('containers/Dockerfile', 'containers/package.json', 'containers/pnpm-lock.yaml', 'containers/requirements.txt', 'containers/preload-cgc-parsers.py', 'src/code-index/**') }}-
      - name: Check the published version against the release source
        id: version
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          test "$VERSION" = "$(node -p "require('./package.json').version")"
          printf 'epoch=%s\n' "$(git show -s --format=%ct HEAD)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build the native test image
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: containers/Dockerfile
          platforms: linux/${{ matrix.arch }}
          build-args: SOURCE_DATE_EPOCH=${{ steps.version.outputs.epoch }}
          labels: org.opencontainers.image.version=${{ inputs.version }}
          load: true
          tags: redline:test
          provenance: false
          sbom: false
      - name: Test real harnesses with a synthetic model
        env:
          REDLINE_CONTAINER_TESTS: '1'
          REDLINE_CONTAINER_IMAGE: redline:test
          REDLINE_CONTAINER_CACHE: ${{ runner.temp }}/redline-code-index/cache
          REDLINE_NATIVE_CONTAINER_TESTS: '1'
          REDLINE_NATIVE_IMAGE: redline:test
        run: pnpm exec vitest run test/container.test.ts test/native-cli.integration.test.ts
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      # Reuse this runner's BuildKit cache; only export the tested image and attestations.
      - name: Export the tested native image by digest
        id: push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: containers/Dockerfile
          platforms: linux/${{ matrix.arch }}
          build-args: SOURCE_DATE_EPOCH=${{ steps.version.outputs.epoch }}
          labels: org.opencontainers.image.version=${{ inputs.version }}
          outputs: type=image,name=ghcr.io/${{ github.repository }},push-by-digest=true,name-canonical=true,push=true
          provenance: true
          sbom: true
      - name: Record the tested image digest
        shell: bash
        env:
          TESTED_ID: ${{ steps.build.outputs.imageid }}
          IMAGE: ghcr.io/${{ github.repository }}
          DIGEST: ${{ steps.push.outputs.digest }}
          DIGEST_DIR: ${{ runner.temp }}/digests
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          [[ "$TESTED_ID" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          # Attested exports return an index digest, not a runtime config digest.
          manifest="$(docker buildx imagetools inspect --raw "$IMAGE@$DIGEST" | jq -er --arg arch "$ARCH" '.manifests[] | select(.platform.os == "linux" and .platform.architecture == $arch) | .digest')"
          [[ "$manifest" =~ ^sha256:[0-9a-f]{64}$ ]]
          published_id="$(docker buildx imagetools inspect --raw "$IMAGE@$manifest" | jq -er '.config.digest')"
          test "$TESTED_ID" = "$published_id"
          mkdir -p "$DIGEST_DIR"
          printf '%s\n' "$DIGEST" > "$DIGEST_DIR/$ARCH"
      - name: Upload the native digest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-digest-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          overwrite: true
          retention-days: 1

  publish:
    needs: test
    if: github.repository == 'dragoscirjan/redline' && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: ${{ runner.temp }}/digests
          pattern: native-digest-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Publish the multi-platform version tag
        shell: bash
        env:
          IMAGE: ghcr.io/${{ github.repository }}
          VERSION: ${{ inputs.version }}
          DIGEST_DIR: ${{ runner.temp }}/digests
        run: |
          set -euo pipefail
          images=()
          for arch in amd64 arm64; do
            IFS= read -r digest < "$DIGEST_DIR/$arch"
            [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
            images+=("$IMAGE@$digest")
          done
          test "${images[0]}" != "${images[1]}"
          docker buildx imagetools create --tag "$IMAGE:$VERSION" "${images[@]}"
          docker buildx imagetools inspect "$IMAGE:$VERSION"
