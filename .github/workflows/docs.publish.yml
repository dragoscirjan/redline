# Builds the documentation site and publishes it under projects/redline/ in
# the dragoscirjan.github.io repository.
#
# The publish job uses the actor-owned PAT only for the destination checkout
# and push; a caller GITHUB_TOKEN cannot push to a different repository.
name: Publish documentation

on:
  workflow_call: {}

permissions:
  contents: read

concurrency:
  group: docs-publish-redline
  cancel-in-progress: false

jobs:
  publish:
    name: Build and publish the site
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out Redline
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.0.0
        with:
          node-version: 24

      - name: Build the documentation site
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare pnpm@10.33.0 --activate
          pnpm install --frozen-lockfile
          # VitePress reads DOCS_BASE so the deployment build emits asset and
          # navigation URLs under the pages project path; local builds keep '/'.
          DOCS_BASE=/projects/redline/ pnpm run docs

      - name: Upload the built site
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: docs-site
          path: docs/.vitepress/dist

      - name: Check out documentation repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0
        with:
          repository: dragoscirjan/dragoscirjan.github.io
          ref: main
          token: ${{ secrets.GH_TOKEN }}
          path: documentation-repository

      - name: Publish Redline documentation
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p documentation-repository/projects/redline
          rsync -a --delete \
            docs/.vitepress/dist/ \
            documentation-repository/projects/redline/

          git -C documentation-repository config user.name 'github-actions[bot]'
          git -C documentation-repository config user.email 'github-actions[bot]@users.noreply.github.com'
          git -C documentation-repository add -- projects/redline

          if git -C documentation-repository diff --cached --quiet; then
            printf 'Redline documentation is unchanged; nothing to publish.\n'
            exit 0
          fi

          git -C documentation-repository commit -m 'docs(redline): update documentation site'
          git -C documentation-repository push origin main
