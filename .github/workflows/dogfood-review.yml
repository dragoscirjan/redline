# In-repo review used by Redline's own pull requests. Review execution is
# enabled only when the MODEL_CREDENTIALS secret is set; without it the run
# degrades to the context bundle. Kept separate from the reusable workflow,
# which requires the published action tag.
name: Code review (dogfood)

on:
  workflow_call:
    inputs:
      verbosity:
        description: Live model stream in the run log - silent (per-file lines only), progress (one dot per model text chunk), or full-output (readable stream text). Default progress.
        required: false
        type: string
        default: progress
      timeout:
        description: Per-file model deadline.
        required: false
        type: string
        default: 4m
      run-timeout:
        description: Whole-review deadline.
        required: false
        type: string
        default: 10m
      review-concurrency:
        description: Maximum simultaneous per-file model calls, from 1 through 8.
        required: false
        type: number
        default: 4
      runtime:
        description: Trusted TypeScript runtime, node or bun. Default node.
        required: false
        type: string
        default: node
      artifact-retention-days:
        description: Number of days to retain the review artifacts
        required: false
        type: number
        default: 45
    secrets:
      github-token:
        description: Fallback publication token (PAT) used while the Redline App secrets are not configured.
        required: false
      redline-review-app-id:
        description: Redline GitHub App id, bound to secrets.REDLINE_REVIEW_APP_ID. Preferred over the PAT fallback.
        required: false
      redline-review-private-key:
        description: Redline GitHub App private key, bound to secrets.REDLINE_REVIEW_PRIVATE_KEY.
        required: false
      model-auth:
        description: Provider-keyed credential map (JSON), bound to the MODEL_CREDENTIALS secret. Enables review execution when set.
        required: false

permissions: {}

jobs:
  context:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out trusted workflow tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
          fetch-depth: 0

      - name: Write pull request requirements
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          set -euo pipefail
          mkdir -p review
          {
            printf '# Pull request requirements\n\n'
            printf 'PR #%s: %s\n\n%s\n\n%s\n' "$PR_NUMBER" "$PR_TITLE" "$PR_BODY" "$PR_URL"
          } > pr-requirements.md

      # The local action path resolves inside Redline itself, which is exactly
      # the dogfood case. External repositories must use the reusable
      # workflow instead; ./github would resolve against their repository.
      # The checkout above is the trusted base revision: pull request code is
      # never installed, built, or executed.
      #
      # Auto-review on this repository's own pull requests: when model-auth
      # is configured, pi runs the real model review and publishes one review
      # per file plus a managed summary. Without model-auth, all three review
      # inputs remain empty together and the action uploads context only.
      # Publication goes through the Redline GitHub App installation token
      # when the App secrets are configured (the action generates it); the PAT
      # (GH_TOKEN) is only the fallback — never the Actions GITHUB_TOKEN.
      - name: Run Redline review action
        uses: ./github
        with:
          backend: ${{ secrets.model-auth != '' && 'pi' || '' }}
          model-config: ${{ secrets.model-auth != '' && '{"provider":"openrouter","endpoint":"https://openrouter.ai/api/v1","model":"z-ai/glm-5.3-flash"}' || '' }}
          model-auth: ${{ secrets.model-auth }}
          # Risks join defects: operational/maintainability/compatibility
          # findings give the auto-review real coverage on docs- and
          # workflow-heavy diffs like this repository's own.
          finding-scope: defects-and-risks
          verbosity: ${{ inputs.verbosity }}
          timeout: ${{ inputs.timeout }}
          run-timeout: ${{ inputs.run-timeout }}
          review-concurrency: ${{ inputs.review-concurrency }}
          runtime: ${{ inputs.runtime }}
          github-token: ${{ secrets.github-token }}
          github-app-id: ${{ secrets.redline-review-app-id }}
          github-app-key: ${{ secrets.redline-review-private-key }}
          artifact-name: pull-request-review-${{ github.event.pull_request.number }}-${{ github.run_id }}
          artifact-retention-days: ${{ inputs.artifact-retention-days }}
