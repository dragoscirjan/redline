# In-repo review used by Redline's own pull requests. Review execution is
# enabled only when the MODEL_CREDENTIALS secret is set; without it the run
# degrades to the context bundle. Kept separate from the reusable workflow,
# which requires the published action tag.
name: Code review (dogfood)

on:
  workflow_call:
    inputs:
      artifact-retention-days:
        description: Number of days to retain the review artifacts
        required: false
        type: number
        default: 45
    secrets:
      model-auth:
        description: Provider-keyed credential map (JSON), bound to the MODEL_CREDENTIALS secret. Enables review execution when set.
        required: false

permissions: {}

jobs:
  context:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out trusted workflow tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
          fetch-depth: 0

      - name: Write pull request requirements
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          set -euo pipefail
          mkdir -p review
          {
            printf '# Pull request requirements\n\n'
            printf 'PR #%s: %s\n\n%s\n\n%s\n' "$PR_NUMBER" "$PR_TITLE" "$PR_BODY" "$PR_URL"
          } > pr-requirements.md

      # The local action path resolves inside Redline itself, which is exactly
      # the dogfood case. External repositories must use the reusable
      # workflow instead; ./github would resolve against their repository.
      # Review inputs are set only when MODEL_CREDENTIALS exists, so an
      # unconfigured repository keeps the context-only behavior.
      - name: Run Redline review action
        uses: ./github
        with:
          backend: ${{ secrets.model-auth != '' && 'pi' || '' }}
          model-config: ${{ secrets.model-auth != '' && '{"provider":"openrouter","endpoint":"https://openrouter.ai/api/v1","model":"z-ai/glm-5.3-flash"}' || '' }}
          model-auth: ${{ secrets.model-auth }}
          artifact-name: pull-request-review-${{ github.event.pull_request.number }}-${{ github.run_id }}
          artifact-retention-days: ${{ inputs.artifact-retention-days }}
