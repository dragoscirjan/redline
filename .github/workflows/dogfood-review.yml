# In-repo review used by Redline's own pull requests. Review execution is
# enabled only when the MODEL_CREDENTIALS secret is set; without it the run
# degrades to the context bundle. Kept separate from the reusable workflow,
# which requires the published action tag.
name: Code review (dogfood)

on:
  workflow_call:
    inputs:
      artifact-retention-days:
        description: Number of days to retain the review artifacts
        required: false
        type: number
        default: 45
    secrets:
      github-token:
        description: GitHub token bound to secrets.GH_TOKEN. Required by the base-revision publication path while the previous action design is checked out; the current action ignores it.
        required: false
      model-auth:
        description: Provider-keyed credential map (JSON), bound to the MODEL_CREDENTIALS secret. Enables review execution when set.
        required: false

permissions: {}

jobs:
  context:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out trusted workflow tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
          fetch-depth: 0

      - name: Write pull request requirements
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          set -euo pipefail
          mkdir -p review
          {
            printf '# Pull request requirements\n\n'
            printf 'PR #%s: %s\n\n%s\n\n%s\n' "$PR_NUMBER" "$PR_TITLE" "$PR_BODY" "$PR_URL"
          } > pr-requirements.md

      # The local action path resolves inside Redline itself, which is exactly
      # the dogfood case. External repositories must use the reusable
      # workflow instead; ./github would resolve against their repository.
      # The checkout above is the trusted base revision: pull request code is
      # never installed, built, or executed.
      #
      # TRANSITION: the action runs from the base revision, which still
      # carries the previous design while this branch is open. That
      # revision's review mode runs the replaced containerized pipeline,
      # which fails silently (empty backend diagnostic, exit 0) on this
      # branch's large restart diff, so review execution stays disabled here
      # and the current pipeline's live behavior is validated by the CI
      # harness matrix instead (echo, pi, opencode against the mock model
      # endpoint). Re-enable backend/model-config once this design is the
      # base revision. The github-token, credential-isolation, and
      # container-engine inputs are then required by the previous action
      # and ignored by the current one, so they stay wired below.
      - name: Run Redline review action
        uses: ./github
        with:
          backend: ''
          model-config: ''
          model-auth: ''
          github-token: ${{ secrets.github-token }}
          credential-isolation: ''
          container-engine: docker
          artifact-name: pull-request-review-${{ github.event.pull_request.number }}-${{ github.run_id }}
          artifact-retention-days: ${{ inputs.artifact-retention-days }}
