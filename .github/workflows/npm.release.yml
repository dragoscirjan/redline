name: Release npm CLI

on:
  workflow_call:
    secrets:
      NPM_TOKEN:
        required: true

permissions: {}

concurrency:
  group: npm-cli-release
  cancel-in-progress: false

jobs:
  release:
    if: github.repository == 'dragoscirjan/redline' && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: npm-release
    outputs:
      published: ${{ steps.release.outputs.published }}
      version: ${{ steps.published.outputs.version }}
    permissions:
      contents: write
      actions: write
      pull-requests: write
      id-token: write
    steps:
      - name: Check out trusted source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Install development dependencies
        uses: ./.github/actions/install-dependencies
        with:
          telemetry-label: npm-release

      # The caller waits for validation, every harness/runtime and all native CLI jobs.
      - name: Create a version PR or publish the reviewed version with Tempel
        id: release
        uses: dragoscirjan/tempel-javascript/.github/actions/release@71e3379b37d477ae0e7915f6463b0a3921d28f8d
        with:
          config: .github/release.json
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          npm_config_ignore_scripts: 'true'
          npm_config_provenance: 'true'
          npm_config_access: public

      - name: Validate the version pull request
        if: steps.release.outputs.pr-number != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.release.outputs.pr-number }}
        run: |
          set -euo pipefail
          head_ref="$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json headRefName --jq .headRefName)"
          gh workflow run ci.yml --ref "$head_ref"

      - name: Wait for npm registry propagation
        if: steps.release.outputs.published == 'true'
        run: sleep 30

      - name: Verify the published package outside the source checkout
        id: published
        if: steps.release.outputs.published == 'true'
        shell: bash
        env:
          RELEASE_MODE: ${{ steps.release.outputs.mode }}
          PUBLISHED: ${{ steps.release.outputs.published }}
          NODE_AUTH_TOKEN: ''
        run: |
          set -euo pipefail
          test "$RELEASE_MODE" = publish
          test "$PUBLISHED" = true
          VERSION="$(node -p "require('./package.json').version")"
          SMOKE="$(mktemp -d "$RUNNER_TEMP/redline-npm.XXXXXX")"
          export NPM_CONFIG_USERCONFIG="$SMOKE/npmrc"
          printf 'registry=https://registry.npmjs.org/\n' > "$NPM_CONFIG_USERCONFIG"
          for attempt in 1 2 3 4 5; do
            if npm install --prefix "$SMOKE/installation" --ignore-scripts --no-audit --no-fund --prefer-online "@dragoscirjan/redline@$VERSION"; then break; fi
            if [ "$attempt" -eq 5 ]; then exit 1; fi
            sleep 15
          done
          CLI="$SMOKE/installation/node_modules/@dragoscirjan/redline/bin/redline.mjs"
          export XDG_CONFIG_HOME="$SMOKE/config" XDG_STATE_HOME="$SMOKE/state"
          git init --initial-branch main "$SMOKE/repository"
          cd "$SMOKE/repository"
          git config user.name 'Redline release verification'
          git config user.email 'redline-release@example.invalid'
          printf 'export const value = 1;\n' > example.ts
          git add example.ts
          git -c core.hooksPath=/dev/null -c commit.gpgSign=false commit -m 'test: seed release fixture'
          BASE="$(git rev-parse HEAD)"
          printf 'export const value = 2;\n' > example.ts
          git add example.ts
          git -c core.hooksPath=/dev/null -c commit.gpgSign=false commit -m 'test: change release fixture'
          node "$CLI" --help
          node "$CLI" review --harness echo --indexing disabled --base "$BASE" --head HEAD
          printf 'export const value = 3;\n' > example.ts
          node "$CLI" review --harness echo --indexing disabled
          printf 'version=%s\n' "$VERSION" >> "$GITHUB_OUTPUT"

  docker:
    needs: release
    if: needs.release.result == 'success' && needs.release.outputs.published == 'true' && needs.release.outputs.version != ''
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/docker.yml
    with:
      version: ${{ needs.release.outputs.version }}
