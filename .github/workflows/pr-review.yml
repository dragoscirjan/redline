name: Pull request code review

on:
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review]

permissions: {}

concurrency:
  group: redline-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    permissions:
      contents: read
    uses: ./.github/workflows/dogfood-review.yml
    with:
      # Dots in the run log: alive at a glance, no flood. Set 'silent' for
      # per-file lines only, 'full-output' for the readable stream text.
      verbosity: full-output
      artifact-retention-days: 45
    secrets:
      # Publication goes through the Redline GitHub App installation token
      # when REDLINE_REVIEW_APP_ID/REDLINE_REVIEW_PRIVATE_KEY are
      # configured; the GH_TOKEN PAT is only the fallback. Never the
      # Actions GITHUB_TOKEN.
      github-token: ${{ secrets.GH_TOKEN }}
      redline-review-app-id: ${{ secrets.REDLINE_REVIEW_APP_ID }}
      redline-review-private-key: ${{ secrets.REDLINE_REVIEW_PRIVATE_KEY }}
      model-auth: ${{ secrets.MODEL_CREDENTIALS }}
