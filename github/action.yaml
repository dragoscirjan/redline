name: Redline review

description: Build a review context bundle for a pull request's exact base and head commits and, when review inputs are supplied, build bounded indexed context, run the harness executor, and publish its per-file review output as artifacts.

author: dragoscirjan

# Inputs are fixed enums/data. No input accepts free-form review
# instructions. Review execution is enabled only when backend, model-config,
# and model-auth are all supplied; otherwise the action keeps the
# context-bundle-only behavior. Indexing is action-owned and enabled by
# default for review execution. Values travel from the action to the review
# tool through the REDLINE_* environment contract (interim design).
inputs:
  backend:
    description: Review harness, pi, opencode, or the deterministic echo harness. Required together with model-config and model-auth to enable review execution.
    required: false
    default: ""
  model-config:
    description: Provider-neutral model configuration JSON (provider, endpoint, model). See docs/runnable-review-configuration.md.
    required: false
    default: ""
  model-auth:
    description: Provider-keyed credential map (JSON); bind to secrets.MODEL_CREDENTIALS. Only the selected credential reaches the harness.
    required: false
    default: ""
  github-token:
    description: Fallback publication token (PAT), used when the App inputs are unset. A GitHub App installation token generated outside the workflow is also accepted. Publication never uses the Actions GITHUB_TOKEN. Empty keeps artifact-only mode.
    required: false
    default: ""
  github-app-id:
    description: Redline GitHub App id; together with github-app-key, an installation token is generated for publication. Preferred over github-token.
    required: false
    default: ""
  github-app-key:
    description: Redline GitHub App private key (PEM). Bind to a secret.
    required: false
    default: ""
  finding-scope:
    description: Finding scope, defects or defects-and-risks
    required: false
    default: defects
  timeout:
    description: Review deadline as a duration, for example 10m, 2h, or 1h30m. Capped at 360m; values above the cap are rejected.
    required: false
    default: 30m
  review-concurrency:
    description: Maximum simultaneous per-file model calls. Must be an integer from 1 through 8.
    required: false
    default: "4"
  verbosity:
    description: Live model stream in the run log - silent (per-file lines only), progress (one dot per model text chunk), full-output (readable stream text). Default progress.
    required: false
    default: progress
  indexing:
    description: Indexed-context mode, enabled or disabled. Enabled builds bounded context inside this action; unavailable context degrades to file-only review.
    required: false
    default: enabled
  indexing-provider:
    description: Code-index provider, cgc or gitnexus.
    required: false
    default: cgc
  artifact-name:
    description: Base name for the downloadable review artifacts
    required: false
    default: redline-review-${{ github.run_id }}
  artifact-retention-days:
    description: Number of days to retain review artifacts, from 1 to 90
    required: false
    default: "45"

runs:
  using: composite
  steps:
    - name: Validate action inputs
      shell: bash
      env:
        BASE_SHA: ${{ github.event.pull_request.base.sha }}
        HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
        INDEXING: ${{ inputs.indexing }}
        INDEXING_PROVIDER: ${{ inputs.indexing-provider }}
        REVIEW_CONCURRENCY: ${{ inputs.review-concurrency }}
        ARTIFACT_RETENTION_DAYS: ${{ inputs.artifact-retention-days }}
      run: |
        set -euo pipefail
        if [[ -z "$BASE_SHA" || -z "$HEAD_SHA" || -z "$HEAD_REPOSITORY" ]]; then
          printf 'Redline review action requires a pull_request event.\n' >&2
          exit 2
        fi
        [[ "$BASE_SHA" =~ ^([0-9a-fA-F]{40}|[0-9a-fA-F]{64})$ ]]
        [[ "$HEAD_SHA" =~ ^([0-9a-fA-F]{40}|[0-9a-fA-F]{64})$ ]]
        [[ "$HEAD_REPOSITORY" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]]
        [[ "$INDEXING" == 'enabled' || "$INDEXING" == 'disabled' ]]
        [[ "$INDEXING_PROVIDER" == 'cgc' || "$INDEXING_PROVIDER" == 'gitnexus' ]]
        [[ "$REVIEW_CONCURRENCY" =~ ^[1-8]$ ]]
        [[ "$ARTIFACT_RETENTION_DAYS" =~ ^[0-9]+$ ]]
        (( ARTIFACT_RETENTION_DAYS >= 1 && ARTIFACT_RETENTION_DAYS <= 90 ))

    - name: Set up pinned Node runtime
      uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.0.0
      with:
        node-version: 24

    - name: Build trusted TypeScript
      shell: bash
      working-directory: ${{ github.action_path }}/../
      env:
        REVIEW_BACKEND: ${{ inputs.backend }}
        REVIEW_MODEL_CONFIG: ${{ inputs.model-config }}
        REVIEW_MODEL_AUTH: ${{ inputs.model-auth }}
      run: |
        set -euo pipefail
        # Review execution is enabled only when the full review input set is
        # present. Partial input must fail loudly instead of silently degrading.
        if [[ -n "$REVIEW_BACKEND" || -n "$REVIEW_MODEL_CONFIG" || -n "$REVIEW_MODEL_AUTH" ]]; then
          if [[ -z "$REVIEW_BACKEND" || -z "$REVIEW_MODEL_CONFIG" || -z "$REVIEW_MODEL_AUTH" ]]; then
            printf 'Review execution requires backend, model-config, and model-auth together.\n' >&2
            exit 2
          fi
        fi
        # The action checkout is the trusted base revision for pull_request
        # events. Pull request code is never installed, built, or executed.
        corepack enable
        corepack prepare pnpm@10.33.0 --activate
        pnpm install --frozen-lockfile --ignore-scripts
        pnpm run build
        test -f dist/src/review/cli.js
        test -f dist/src/action/review.js
        test -f dist/src/context-bundle.js

    # Two-phase token flow: token 1 exists for the review-start (and
    # failure) notifications minted while the review data is collected;
    # token 2 is minted after the review completes and covers only the
    # publication itself. The review step runs token-free.
    - name: Generate Redline App token for review start
      id: app-token-start
      if: ${{ inputs.github-app-id != '' && inputs.github-app-key != '' }}
      uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
      with:
        app-id: ${{ inputs.github-app-id }}
        private-key: ${{ inputs.github-app-key }}
        owner: ${{ github.repository_owner }}

    - name: Validate action inputs with trusted TypeScript
      if: always()
      shell: bash
      working-directory: ${{ github.action_path }}/../
      env:
        REDLINE_HARNESS: ${{ inputs.backend }}
        REDLINE_MODEL_CONFIG: ${{ inputs.model-config }}
        REDLINE_MODEL_AUTH: ${{ inputs.model-auth }}
        REDLINE_FINDING_SCOPE: ${{ inputs.finding-scope }}
        REDLINE_TIMEOUT: ${{ inputs.timeout }}
        REDLINE_REVIEW_CONCURRENCY: ${{ inputs.review-concurrency }}
        REDLINE_VERBOSITY: ${{ inputs.verbosity }}
        REDLINE_REVIEW_DIR: ${{ github.workspace }}/review
        REDLINE_SOURCE_DIR: ${{ github.workspace }}/source-at-head
        REDLINE_OUTPUT_DIR: ${{ github.workspace }}/reviews
        REDLINE_REUSE_DIR: ${{ inputs.backend != '' && inputs.model-config != '' && inputs.model-auth != '' && format('{0}/redline-review-cache', runner.temp) || '' }}
        REDLINE_REUSE_NAMESPACE: ${{ inputs.backend != '' && inputs.model-config != '' && inputs.model-auth != '' && format('{0}#{1}', github.repository, github.event.pull_request.number) || '' }}
        # The publication context arrives together or not at all: the
        # repository, pull request, and head only count as provided when a
        # publication token is present. The App installation token is
        # preferred over the PAT fallback.
        REDLINE_PUBLISH_TOKEN: ${{ steps.app-token-start.outputs.token || inputs.github-token }}
        REDLINE_REPOSITORY: ${{ (steps.app-token-start.outputs.token || inputs.github-token) != '' && github.repository || '' }}
        REDLINE_PULL_REQUEST: ${{ (steps.app-token-start.outputs.token || inputs.github-token) != '' && github.event.pull_request.number || '' }}
        REDLINE_HEAD: ${{ (steps.app-token-start.outputs.token || inputs.github-token) != '' && github.event.pull_request.head.sha || '' }}
      run: |
        set -euo pipefail
        # Authoritative input validation runs even in context-only mode, so
        # invalid optional inputs fail instead of passing silently.
        node dist/src/review/cli.js --validate-only

    - name: Restore validated per-file review records
      id: review-cache-restore
      if: ${{ inputs.backend != '' && inputs.model-config != '' && inputs.model-auth != '' }}
      continue-on-error: true
      uses: actions/cache/restore@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # v5.0.3
      with:
        path: ${{ runner.temp }}/redline-review-cache
        key: redline-review-v2-${{ github.repository_id }}-pr-${{ github.event.pull_request.number }}-${{ github.run_id }}-${{ github.run_attempt }}
        restore-keys: |
          redline-review-v2-${{ github.repository_id }}-pr-${{ github.event.pull_request.number }}-

    - name: Fetch pull request commits as data
      shell: bash
      env:
        BASE_SHA: ${{ github.event.pull_request.base.sha }}
        HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
      run: |
        set -euo pipefail
        base_url="https://github.com/${GITHUB_REPOSITORY}.git"
        head_url="https://github.com/${HEAD_REPOSITORY}.git"
        if [[ "$HEAD_REPOSITORY" == "$GITHUB_REPOSITORY" ]]; then
          git fetch --no-tags "$base_url" "$BASE_SHA" "$HEAD_SHA"
        else
          git fetch --no-tags "$base_url" "$BASE_SHA"
          git fetch --no-tags "$head_url" "$HEAD_SHA"
        fi
        git cat-file -e "$BASE_SHA^{commit}"
        git cat-file -e "$HEAD_SHA^{commit}"

    - name: Build bounded code index
      id: code-index
      if: ${{ inputs.indexing == 'enabled' && inputs.backend != '' && inputs.model-config != '' && inputs.model-auth != '' }}
      uses: $/github/code-index
      with:
        provider: ${{ inputs.indexing-provider }}
        base: ${{ github.event.pull_request.base.sha }}
        head: ${{ github.event.pull_request.head.sha }}
        repository: ${{ github.repository }}
        output-directory: ${{ github.workspace }}/code-index

    - name: Build review context bundle
      shell: bash
      env:
        BASE_SHA: ${{ github.event.pull_request.base.sha }}
        HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      run: |
        set -euo pipefail
        node "${{ github.action_path }}/../dist/src/context-bundle.js" \
          --base "$BASE_SHA" \
          --head "$HEAD_SHA" \
          --output "$GITHUB_WORKSPACE/review" \
          --source "$GITHUB_WORKSPACE/source-at-head"
        if [[ -f "$GITHUB_WORKSPACE/pr-requirements.md" ]]; then
          cp "$GITHUB_WORKSPACE/pr-requirements.md" "$GITHUB_WORKSPACE/review/requirements.md"
        fi

    - name: Upload review context artifact
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: ${{ inputs.artifact-name }}-context
        path: |
          code-index/code-context.json
          source-at-head/
          review/
        if-no-files-found: error
        include-hidden-files: true
        retention-days: ${{ inputs.artifact-retention-days }}

    - name: Ensure harness binary
      if: ${{ inputs.backend == 'pi' || inputs.backend == 'opencode' }}
      shell: bash
      run: |
        set -euo pipefail
        # Trusted workflow tooling: the harness binaries are fixed packages
        # and the backend is a validated enum. The guard keeps a binary
        # installed by the calling workflow (for example the CI matrix)
        # instead of reinstalling it.
        #
        # EXCEPTION: opencode-ai's postinstall script links its platform
        # binary, so --ignore-scripts would break it. The version is
        # pinned instead, because this action later runs with model and
        # publication credentials and a compromised package script could
        # alter the CLI before it runs. pi installs with scripts disabled;
        # it has none.
        case "${{ inputs.backend }}" in
          pi) command -v pi >/dev/null 2>&1 || npm install -g --ignore-scripts @earendil-works/pi-coding-agent ;;
          opencode) command -v opencode >/dev/null 2>&1 || npm install -g opencode-ai@1.18.34 ;;
        esac

    - name: Announce review start
      if: ${{ inputs.backend != '' && inputs.model-config != '' && inputs.model-auth != '' && (steps.app-token-start.outputs.token != '' || inputs.github-token != '') }}
      continue-on-error: true
      shell: bash
      working-directory: ${{ github.action_path }}/../
      env:
        REDLINE_HARNESS: ${{ inputs.backend }}
        REDLINE_MODEL_CONFIG: ${{ inputs.model-config }}
        REDLINE_PUBLISH_TOKEN: ${{ steps.app-token-start.outputs.token || inputs.github-token }}
        REDLINE_REPOSITORY: ${{ github.repository }}
        REDLINE_PULL_REQUEST: ${{ github.event.pull_request.number }}
        REDLINE_HEAD: ${{ github.event.pull_request.head.sha }}
      run: |
        set -euo pipefail
        # The "review in progress" comment goes out before the review: a
        # run can take tens of minutes and the PR must not look abandoned.
        # A failed announcement is logged and the review continues.
        node "${{ github.action_path }}/../dist/src/review/cli.js" --announce-only

    - name: Run harness review
      id: review
      if: ${{ inputs.backend != '' && inputs.model-config != '' && inputs.model-auth != '' }}
      shell: bash
      working-directory: ${{ github.action_path }}/../
      env:
        REDLINE_HARNESS: ${{ inputs.backend }}
        REDLINE_MODEL_CONFIG: ${{ inputs.model-config }}
        REDLINE_MODEL_AUTH: ${{ inputs.model-auth }}
        REDLINE_FINDING_SCOPE: ${{ inputs.finding-scope }}
        REDLINE_TIMEOUT: ${{ inputs.timeout }}
        REDLINE_REVIEW_CONCURRENCY: ${{ inputs.review-concurrency }}
        REDLINE_VERBOSITY: ${{ inputs.verbosity }}
        REDLINE_REVIEW_DIR: ${{ github.workspace }}/review
        REDLINE_SOURCE_DIR: ${{ github.workspace }}/source-at-head
        REDLINE_OUTPUT_DIR: ${{ github.workspace }}/reviews
        REDLINE_REUSE_DIR: ${{ runner.temp }}/redline-review-cache
        REDLINE_REUSE_NAMESPACE: ${{ format('{0}#{1}', github.repository, github.event.pull_request.number) }}
        REDLINE_CODE_CONTEXT: ${{ steps.code-index.outputs.context-file }}
        REDLINE_CODE_CONTEXT_REPOSITORY: ${{ steps.code-index.outputs.context-file != '' && github.repository || '' }}
        CODE_INDEX_PROVIDER: ${{ inputs.indexing-provider }}
        # Explicit gate: scripted replay is not independent live-model evidence.
        # Never enable until the recall, clean-change, and latency gates pass.
        CODE_INDEX_VERIFICATION_ENABLED: 'false'
      run: |
        set -euo pipefail
        # Token-free by design: the review process carries no publication
        # credential at all. Publication happens in its own step with a
        # freshly minted token, so the token lifetime never bounds the
        # review duration.
        node "${{ github.action_path }}/../dist/src/action/review.js"

    - name: Save validated per-file review records
      if: ${{ always() && inputs.backend != '' && inputs.model-config != '' && inputs.model-auth != '' }}
      continue-on-error: true
      uses: actions/cache/save@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # v5.0.3
      with:
        path: ${{ runner.temp }}/redline-review-cache
        key: redline-review-v2-${{ github.repository_id }}-pr-${{ github.event.pull_request.number }}-${{ github.run_id }}-${{ github.run_attempt }}

    - name: Generate Redline App token for publication
      id: app-token-publish
      if: ${{ !cancelled() && inputs.backend != '' && inputs.model-config != '' && inputs.model-auth != '' && inputs.github-app-id != '' && inputs.github-app-key != '' }}
      uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
      with:
        app-id: ${{ inputs.github-app-id }}
        private-key: ${{ inputs.github-app-key }}
        owner: ${{ github.repository_owner }}

    - name: Publish review
      id: publish
      if: ${{ inputs.backend != '' && inputs.model-config != '' && inputs.model-auth != '' && (steps.app-token-publish.outputs.token != '' || inputs.github-token != '') }}
      shell: bash
      working-directory: ${{ github.action_path }}/../
      env:
        REDLINE_OUTPUT_DIR: ${{ github.workspace }}/reviews
        REDLINE_PUBLISH_TOKEN: ${{ steps.app-token-publish.outputs.token || inputs.github-token }}
        REDLINE_REPOSITORY: ${{ github.repository }}
        REDLINE_PULL_REQUEST: ${{ github.event.pull_request.number }}
        REDLINE_HEAD: ${{ github.event.pull_request.head.sha }}
      run: |
        set -euo pipefail
        # Fresh token, seconds-old: loads the written records and summary
        # from the output directory and publishes them. Fails when every
        # requested file review failed, or when the PR moved past the
        # reviewed head. A structured publication report proves that the
        # managed summary reached a final state even when all file reviews
        # failed and the CLI intentionally exits non-zero.
        publication_output=$(mktemp "$RUNNER_TEMP/redline-publication.XXXXXX")
        trap 'rm -f "$publication_output"' EXIT
        set +e
        node "${{ github.action_path }}/../dist/src/review/cli.js" --publish-only >"$publication_output"
        publication_status=$?
        set -e
        cat "$publication_output"
        summary_finalized=false
        if node - "$publication_output" <<'NODE'
        const { readFileSync } = require('node:fs');
        const reports = readFileSync(process.argv[2], 'utf8')
          .split('\n')
          .filter((line) => line.length > 0)
          .flatMap((line) => {
            try { return [JSON.parse(line)]; } catch { return []; }
          });
        const finalized = reports.some((report) => Number.isSafeInteger(report?.summaryCommentId));
        process.exit(finalized ? 0 : 1);
        NODE
        then
          summary_finalized=true
        fi
        printf 'summary-finalized=%s\n' "$summary_finalized" >> "$GITHUB_OUTPUT"
        exit "$publication_status"

    - name: Notify review failure
      if: ${{ failure() && (steps.review.conclusion == 'failure' || (steps.publish.conclusion == 'failure' && steps.publish.outputs.summary-finalized != 'true')) && inputs.backend != '' && inputs.model-config != '' && inputs.model-auth != '' }}
      continue-on-error: true
      shell: bash
      working-directory: ${{ github.action_path }}/../
      env:
        REDLINE_HARNESS: ${{ inputs.backend }}
        REDLINE_MODEL_CONFIG: ${{ inputs.model-config }}
        # Prefer the freshly minted publication token: a failure after one
        # hour leaves the start token expired, while the publication token
        # is seconds old. The start token covers earlier failures.
        REDLINE_PUBLISH_TOKEN: ${{ steps.app-token-publish.outputs.token || steps.app-token-start.outputs.token || inputs.github-token }}
        REDLINE_REPOSITORY: ${{ github.repository }}
        REDLINE_PULL_REQUEST: ${{ github.event.pull_request.number }}
        REDLINE_HEAD: ${{ github.event.pull_request.head.sha }}
        REDLINE_FAILURE_REASON: The review run failed; see the run log and artifacts for diagnostics.
      run: |
        set -euo pipefail
        # Replaces the "review in progress" comment with the failure state
        # so it never stays at running. Best effort.
        node "${{ github.action_path }}/../dist/src/review/cli.js" --announce-failure

    - name: Upload review output artifact
      if: ${{ always() && inputs.backend != '' && inputs.model-config != '' && inputs.model-auth != '' }}
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: ${{ inputs.artifact-name }}-reviews
        path: reviews/
        if-no-files-found: ignore
        retention-days: ${{ inputs.artifact-retention-days }}
