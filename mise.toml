[tools]
pnpm = "10.33.0"
node = "24"
bun = "1.4.4"
python = "3.12"

[tasks.typecheck]
description = "Check active scaffold TypeScript"
run = "pnpm run typecheck"

[tasks.build]
description = "Build the project to mjs 'binary'"
run = "pnpm run build"

[tasks.test]
description = "Run active Vitest and Bats scaffold tests"
run = "pnpm test"

[tasks.validate]
description = "Check types, test the active scaffold, and build its docs"
run = ["mise run typecheck", "mise run test", "mise run docs"]

[tasks.docs]
description = "Build the active VitePress documentation site"
run = "pnpm run docs"

[tasks."docs:serve"]
description = "Serve the active documentation site"
run = "pnpm run serve"

[tasks."docs:preview"]
description = "Preview the active documentation build"
run = "pnpm run docs:preview"

[tasks."deps:sync"]
description = "Install the approved mise tools and project dependencies"
run = ["mise install --yes", "pnpm install --frozen-lockfile"]
