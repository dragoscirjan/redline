[settings]
lockfile = true

[tools]
pnpm = "10.33.0"
node = "24"
python = "3.12"

[tasks.build]
description = "Compile TypeScript sources and tests"
run = "pnpm run build"

[tasks.benchmark]
description = "Run the deterministic recorded review-quality benchmark"
run = "pnpm run benchmark"

[tasks."benchmark:live-model"]
description = "Run the opt-in live-model benchmark capture"
run = "pnpm run benchmark:live-model"

[tasks."benchmark:live-verification"]
description = "Opt-in independent live discovery-to-verifier capture; never runs in CI"
run = "pnpm run benchmark:live-verification"

[tasks."benchmark:live-indexer"]
description = "Run the opt-in pinned-CGC fixture evaluation"
run = "REDLINE_LIVE_CODE_INDEX_TESTS=1 pnpm exec bats --show-output-of-passing-tests test/code-index-action.bats --filter 'live pinned CGC smoke test is opt-in'"

[tasks.typecheck]
description = "Check TypeScript types"
run = "pnpm run typecheck"

[tasks.test]
description = "Build and run the Node and Bats test suites"
run = "pnpm test"

[tasks.validate]
description = "Check types, build and test the code, and build the docs"
run = [
  "mise run typecheck",
  "mise run test",
  "mise run docs",
]

[tasks.docs]
description = "Build the VitePress documentation site"
run = "pnpm run docs"

[tasks."docs:serve"]
description = "Serve the VitePress documentation site locally"
run = "pnpm run serve"

[tasks."docs:preview"]
description = "Preview the built VitePress documentation site"
run = "pnpm run docs:preview"

[tasks."deps:sync"]
description = "Install mise tools and project dependencies"
run = ["mise install --yes", "pnpm install --frozen-lockfile"]

[tasks."deps:clean"]
description = "Remove installed dependencies"
run = "rm -rf node_modules"
