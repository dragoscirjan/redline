[settings]
lockfile = true

[tools]
pnpm = "latest"
node = "24"
python = "3.12"

[tasks.build]
description = "Build the bundled GitHub Action"
run = "pnpm run build"

[tasks.commitlint]
description = "Validate a commit message file"
run = "pnpm run commitlint -- --edit"

[tasks.typecheck]
description = "Check TypeScript types"
run = "pnpm run typecheck"

[tasks.test]
description = "Run the Vitest suite"
run = "pnpm test"

[tasks.lint]
description = "Lint and fix the repository"
run = "pnpm run lint"

[tasks."lint:check"]
description = "Check linting without modifying files"
run = "pnpm run lint:check"

[tasks."lint-staged"]
description = "Lint and format staged files"
run = "pnpm run lint-staged"

[tasks."duplicate-check"]
description = "Check source code for duplication"
run = "pnpm run duplicate-check"

[tasks.format]
description = "Format repository files"
run = "pnpm run format"

[tasks."format:check"]
description = "Check formatting without modifying files"
run = "pnpm run format:check"

[tasks.audit]
description = "Audit dependencies for known vulnerabilities"
run = "pnpm run audit"

[tasks.evaluation]
description = "Run the deterministic recorded review-quality gate"
run = "pnpm run evaluation"

[tasks.validate]
description = "Run the local validation pipeline"
run = [
  "mise run format:check",
  "mise run lint:check",
  "mise run typecheck",
  "mise run test",
  "mise run docs",
  "mise run evaluation",
  "mise run duplicate-check",
  "mise run audit",
  "mise run build",
]

[tasks.docs]
description = "Build the VitePress documentation site"
run = "pnpm run docs"

[tasks."docs:serve"]
description = "Serve the VitePress documentation site locally"
run = "pnpm run serve"

[tasks."docs:preview"]
description = "Preview the built VitePress documentation site"
run = "pnpm run docs:preview"

[tasks."deps:sync"]
description = "Install mise tools and project dependencies"
run = ["mise install --yes", "pnpm install --frozen-lockfile"]

[tasks."deps:clean"]
description = "Remove installed dependencies and quality reports"
run = "rm -rf node_modules coverage .jscpd"
