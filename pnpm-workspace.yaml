# Supply-chain policy and dependency overrides for this single-package repo.
minimumReleaseAge: 1440

overrides:
  # rollup 4.64.0 published inside the minimum-release-age window and broke
  # policy-verified installs (pulled in by vitepress via vite). Pin to the
  # newest release older than the window; bump it only with a reviewed PR.
  rollup: 4.63.6

ignoredBuiltDependencies:
  # esbuild's postinstall only validates the binary version; the binary ships
  # through the @esbuild/<platform> optional dependencies, so the script is
  # unnecessary here. Executing it adds supply-chain surface for no benefit.
  - esbuild
